<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Engineering Studio</title>
<style>
:root{--bg:#eceff1;--fg:#17212b;--card:#fff;--mut:#5d6b78;--ac:#d9541e;--ln:#cfd6dc;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171e;--fg:#e6edf3;--card:#18222c;--mut:#93a3b1;--ln:#2a3846;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10171e;--fg:#e6edf3;--card:#18222c;--mut:#93a3b1;--ln:#2a3846;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:720px;margin-inline:auto;padding:12px}
h1{font:600 18px/1.2 system-ui,sans-serif;margin:4px 0 10px}h2{font:600 15px/1.2 system-ui,sans-serif;margin:0 0 8px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
button,select,input{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:8px 12px;min-height:40px}
.tabs button{white-space:nowrap}.tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff}.tabs button[disabled]{opacity:.5}
.card{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:10px;margin-bottom:10px}
.g{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--mut)}label input,label select{width:100%;color:var(--fg)}
.res{margin-top:10px;border-top:1px solid var(--ln);padding-top:8px}
.res div{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-variant-numeric:tabular-nums}.res b{font-weight:600}
.note{color:var(--mut);font-size:12px;margin:6px 0 0}
</style></head><body>
<h1>Engineering Studio</h1>
<div class="tabs" id="tabs"></div>
<div id="out"></div>
<p class="note">Guide values only. Check results against the project specification and the current authority rules before use on site.</p>
<script>
const $=id=>document.getElementById(id);
//CALC
const f=(n,d=2)=>Number.isFinite(n)?(+n.toFixed(d)).toLocaleString("en-US",{maximumFractionDigits:d}):"–";
const U={Length:{m:1,mm:.001,cm:.01,km:1e3,in:.0254,ft:.3048,yd:.9144},Pressure:{bar:1e5,psi:6894.757,kPa:1e3,MPa:1e6,Pa:1},Power:{kW:1e3,W:1,hp:745.7},Mass:{kg:1,g:.001,t:1e3,lb:.45359237},Area:{"m²":1,"mm²":1e-6,"ft²":.09290304,"in²":6.4516e-4}};
function conv(cat,v,a,b){if(cat==="Temperature"){const c=a==="°C"?v:a==="°F"?(v-32)*5/9:v-273.15;return b==="°C"?c:b==="°F"?c*9/5+32:c+273.15}return v*U[cat][a]/U[cat][b]}
const C={
Electrical:[
{t:"Motor or load current",i:[["Power (kW)",7.5],["Voltage (V)",415],["Power factor",.85],["Efficiency",.9],["Phases (1 or 3)",3]],r:v=>{const I=v[0]*1e3/((v[4]==1?1:Math.sqrt(3))*v[1]*v[2]*v[3]);return[["Full-load current (A)",f(I)],["Apparent power (kVA)",f(v[0]/(v[2]*v[3]))]]}},
{t:"Voltage drop",i:[["Cable mV/A/m (from table)",7.3],["Current (A)",20],["Length (m)",50],["Supply voltage (V)",415]],r:v=>{const d=v[0]*v[1]*v[2]/1e3;return[["Voltage drop (V)",f(d)],["Voltage drop (%)",f(d/v[3]*100)]]}},
{t:"Transformer turns ratio",i:[["HV voltage (V)",11000],["LV voltage (V)",415],["Measured ratio",26.5]],r:v=>{const c=v[0]/v[1];return[["Calculated ratio",f(c,4)],["Error (%)",f((v[2]-c)/c*100,3)]]}}],
Mechanical:[
{t:"Pipe bend",i:[["Bend radius (mm)",171.45],["Angle (°)",90]],r:v=>[["Arc length (mm)",f(Math.PI*v[0]*v[1]/180)],["Tangent length (mm)",f(v[0]*Math.tan(v[1]*Math.PI/360))]]},
{t:"Steel pipe weight",i:[["Outside diameter (mm)",114.3],["Wall (mm)",6],["Length (m)",6]],r:v=>{const k=Math.PI/4*(v[0]**2-(v[0]-2*v[1])**2)*7850/1e6;return[["Weight (kg/m)",f(k)],["Total (kg)",f(k*v[2])]]}}],
Instrument:[
{t:"4–20 mA signal",i:[["Reading (mA)",12],["Range low",0],["Range high",100]],r:v=>[["Process value",f(v[1]+(v[0]-4)/16*(v[2]-v[1]))],["Percent of span",f((v[0]-4)/16*100)]]},
{t:"Expected mA for a value",i:[["Process value",50],["Range low",0],["Range high",100]],r:v=>[["Expected output (mA)",f(4+(v[0]-v[1])/(v[2]-v[1])*16,3)]]}],
Civil:[
{t:"Concrete volume",i:[["Length (m)",5],["Width (m)",3],["Thickness (m)",.2]],r:v=>[["Volume (m³)",f(v[0]*v[1]*v[2],3)]]},
{t:"Beam, uniform load (simple span)",i:[["Load w (kN/m)",10],["Span L (m)",6]],r:v=>[["Max moment (kN·m)",f(v[0]*v[1]**2/8)],["Max shear (kN)",f(v[0]*v[1]/2)]]}]};
//ENDCALC
let tab="Electrical";const tabs=Object.keys(C).concat("Convert");
$("tabs").innerHTML=tabs.map(t=>'<button data-t="'+t+'">'+t+'</button>').concat('<button disabled>Draw (next)</button>').join("");
$("tabs").addEventListener("click",e=>{if(e.target.dataset.t){tab=e.target.dataset.t;show()}});
function show(){document.querySelectorAll("[data-t]").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
 if(tab==="Convert")return conv_ui();
 $("out").innerHTML=C[tab].map((c,ci)=>'<div class="card" data-c="'+ci+'"><h2>'+c.t+'</h2><div class="g">'+c.i.map((x,k)=>'<label>'+x[0]+'<input type="number" inputmode="decimal" step="any" value="'+x[1]+'" data-k="'+k+'"></label>').join("")+'</div><div class="res"></div></div>').join("");
 document.querySelectorAll(".card").forEach(run)}
function run(card){const c=C[tab][+card.dataset.c],v=[...card.querySelectorAll("input")].map(i=>parseFloat(i.value));
 card.querySelector(".res").innerHTML=v.some(isNaN)?"Enter all values.":c.r(v).map(r=>"<div><span>"+r[0]+"</span><b>"+r[1]+"</b></div>").join("")}
$("out").addEventListener("input",e=>{const c=e.target.closest(".card");if(c&&tab!=="Convert")run(c)});
function conv_ui(){const cats=Object.keys(U).concat("Temperature");
 $("out").innerHTML='<div class="card"><h2>Unit converter</h2><div class="g"><label>Type<select id="cc">'+cats.map(c=>"<option>"+c+"</option>").join("")+'</select></label><label>Value<input id="cv" type="number" inputmode="decimal" step="any" value="1"></label><label>From<select id="cf"></select></label><label>To<select id="ct"></select></label></div><div class="res" id="cr"></div></div>';
 const fill=()=>{const u=$("cc").value==="Temperature"?["°C","°F","K"]:Object.keys(U[$("cc").value]);$("cf").innerHTML=u.map(x=>"<option>"+x+"</option>").join("");$("ct").innerHTML=u.map((x,i)=>"<option"+(i==1?" selected":"")+">"+x+"</option>").join("");go()};
 const go=()=>{const v=parseFloat($("cv").value);$("cr").innerHTML=isNaN(v)?"Enter a value.":"<div><span>"+f(v,6)+" "+$("cf").value+"</span><b>"+f(conv($("cc").value,v,$("cf").value,$("ct").value),6)+" "+$("ct").value+"</b></div>"};
 $("cc").onchange=fill;["cv","cf","ct"].forEach(i=>$(i).oninput=go);fill()}
show();
</script></body></html>
